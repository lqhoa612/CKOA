<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Stylesheet'); ?>
</head>
<body>

  <!-- Startup: shown while the first request is in flight, or if it fails -->
  <section id="startup-screen" class="screen">
    <div class="login-card">
      <h1><?= appTitle ?></h1>
      <p class="muted" id="startup-message">Loading your order page&hellip;</p>
      <p id="startup-error" class="error hidden"></p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="screen hidden">
    <header class="app-header">
      <div class="brand">
        <img id="brand-logo" class="brand-logo hidden" alt="">
        <div>
          <div class="restaurant-name" id="restaurant-name"></div>
          <div class="muted small" id="restaurant-email"></div>
        </div>
      </div>
      <nav class="header-nav">
        <button id="nav-catalog" class="nav-btn active">Order</button>
        <button id="nav-history" class="nav-btn">My orders</button>
        <button id="nav-kitchen" class="nav-btn hidden">To fulfil</button>
        <button id="nav-invoiced" class="nav-btn hidden">Invoiced</button>
      </nav>
    </header>

    <!-- Catalogue view -->
    <main id="catalog-view">
      <div id="catalog-list"></div>
    </main>

    <!-- History view -->
    <main id="history-view" class="hidden">
      <div id="history-list"></div>
    </main>

    <!-- Central kitchen: orders waiting to be fulfilled -->
    <main id="kitchen-view" class="hidden">
      <div id="kitchen-list"></div>
    </main>

    <!-- Central kitchen: invoices already issued -->
    <main id="invoiced-view" class="hidden">
      <div id="invoiced-list"></div>
    </main>

    <!-- Cart bar -->
    <div id="cart-bar" class="cart-bar hidden">
      <div class="cart-summary">
        <span id="cart-count">0</span> items &middot; <span id="cart-total">$0.00</span>
      </div>
      <button id="checkout-btn">View cart</button>
    </div>
  </section>

  <!-- Checkout modal -->
  <div id="checkout-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Confirm your order</h2>
        <button id="close-checkout" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <div class="checkout-table-wrap">
        <table class="checkout-table">
          <thead>
            <tr>
              <th>Item</th>
              <th class="num">Qty</th>
              <th>Unit</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody id="checkout-items"></tbody>
        </table>
      </div>

      <div class="checkout-actions">
        <button id="clear-cart-btn" class="link-btn">Clear all items</button>
        <span class="checkout-total">Total: <strong id="checkout-total">$0.00</strong></span>
      </div>

      <label class="field-label">Delivery date</label>
      <div id="delivery-dates" class="delivery-dates"></div>

      <label class="field-label">Ordered by</label>
      <div class="readonly-field" id="orderer-name"></div>

      <label class="field-label" for="delivery-address">Delivery address</label>
      <textarea id="delivery-address" rows="2" placeholder="Where should we deliver?"></textarea>

      <label class="field-label" for="order-notes">Notes for the kitchen <span class="field-optional">optional</span></label>
      <textarea id="order-notes" rows="3" placeholder="Need something that is not on the list? Ask for it here."></textarea>

      <p id="order-error" class="error hidden"></p>

      <button id="submit-order-btn" class="primary-btn">Place order</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <?!= include('JavaScript'); ?>
</body>
</html>
