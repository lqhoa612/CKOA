<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <?!= include('Stylesheet'); ?>
</head>
<body>

  <!-- Login screen -->
  <section id="login-screen" class="screen">
    <div class="login-card">
      <h1><?= appTitle ?></h1>
      <p class="muted">Sign in with your restaurant's Google account to order from the central kitchen.</p>
      <div id="g_id_signin_container"></div>
      <p id="login-error" class="error hidden"></p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="screen hidden">
    <header class="app-header">
      <div>
        <div class="restaurant-name" id="restaurant-name"></div>
        <div class="muted small" id="restaurant-email"></div>
      </div>
      <nav class="header-nav">
        <button id="nav-catalog" class="nav-btn active">Order</button>
        <button id="nav-history" class="nav-btn">My orders</button>
        <button id="logout-btn" class="nav-btn ghost">Sign out</button>
      </nav>
    </header>

    <!-- Catalogue view -->
    <main id="catalog-view">
      <div id="catalog-list"></div>
    </main>

    <!-- History view -->
    <main id="history-view" class="hidden">
      <div id="history-list"></div>
    </main>

    <!-- Cart bar -->
    <div id="cart-bar" class="cart-bar hidden">
      <div class="cart-summary">
        <span id="cart-count">0</span> items &middot; <span id="cart-total">$0.00</span>
      </div>
      <button id="checkout-btn">View cart</button>
    </div>
  </section>

  <!-- Checkout modal -->
  <div id="checkout-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Confirm your order</h2>
        <button id="close-checkout" class="icon-btn" aria-label="Close">&times;</button>
      </div>
      <div id="checkout-items"></div>
      <div class="checkout-total">Total: <strong id="checkout-total">$0.00</strong></div>

      <label class="field-label">Delivery date</label>
      <div id="delivery-dates" class="delivery-dates"></div>

      <label class="field-label" for="orderer-name">Your name</label>
      <input type="text" id="orderer-name" placeholder="Who is placing this order?">

      <label class="field-label" for="delivery-address">Delivery address</label>
      <textarea id="delivery-address" rows="2" placeholder="Where should we deliver?"></textarea>

      <p id="order-error" class="error hidden"></p>

      <button id="submit-order-btn" class="primary-btn">Place order</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script>
    var CKOA_CONFIG = {
      googleClientId: <?!= JSON.stringify(googleClientId) ?>
    };
  </script>
  <?!= include('JavaScript'); ?>
</body>
</html>
