<script>
(function () {
  'use strict';

  var state = {
    restaurant: null,
    role: '',
    items: [],
    deliveryDates: [],
    selectedDate: null,
    cart: {}, // id -> qty
    kitchen: { pending: [], invoiced: [] },
    admin: { orders: [], restaurants: [], summary: {} },
    openOrderId: null // which order is expanded, for kitchen and admin alike
  };

  // ---------------------------------------------------------------------
  // Startup: Google has already signed the user in before this page loads,
  // so the first call both identifies them and loads their catalogue.
  // ---------------------------------------------------------------------

  window.onload = function () {
    google.script.run
      .withSuccessHandler(onLoaded)
      .withFailureHandler(function (err) { showStartupError(err.message || String(err)); })
      .getOrderPageData();
  };

  function onLoaded(data) {
    state.restaurant = data.restaurant;
    state.items = data.items;
    state.deliveryDates = data.deliveryDates;
    state.role = data.role || '';
    if (state.deliveryDates.length) state.selectedDate = state.deliveryDates[0].iso;

    document.getElementById('startup-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('restaurant-name').textContent = state.restaurant.name;
    document.getElementById('restaurant-email').textContent = state.restaurant.email;
    showLogo(data.logoUrl);

    // Each role gets its own pair of tabs; nobody sees another role's.
    if (state.role === 'kitchen' || state.role === 'admin') {
      document.getElementById('nav-catalog').classList.add('hidden');
      document.getElementById('nav-history').classList.add('hidden');
    }
    if (state.role === 'kitchen') {
      document.getElementById('nav-kitchen').classList.remove('hidden');
      document.getElementById('nav-invoiced').classList.remove('hidden');
      switchView('kitchen');
    } else if (state.role === 'admin') {
      document.getElementById('nav-admin').classList.remove('hidden');
      document.getElementById('nav-admin-invoices').classList.remove('hidden');
      switchView('admin');
    } else {
      renderCatalog();
    }
  }

  /** Stays hidden when no logo is configured, or when the URL fails to load. */
  function showLogo(url) {
    if (!url) return;
    var img = document.getElementById('brand-logo');
    img.onload = function () { img.classList.remove('hidden'); };
    img.onerror = function () { img.classList.add('hidden'); };
    img.src = url;
  }

  function showStartupError(msg) {
    document.getElementById('startup-message').classList.add('hidden');
    var el = document.getElementById('startup-error');
    el.textContent = msg;
    el.classList.remove('hidden');

    // Signing in with the wrong account lands here and never reaches the app,
    // so the way out has to be on this screen rather than behind the nav.
    var panel = document.getElementById('startup-account');
    panel.innerHTML = accountPanelHtml();
    panel.classList.remove('hidden');
  }

  // ---------------------------------------------------------------------
  // Account: the app has no session of its own, Google owns the sign-in.
  // The way to "log out" is to switch Google account or sign out of Google.
  // ---------------------------------------------------------------------

  /**
   * Same panel on the error screen and in the in-app Account dialog.
   * Only offers routes that are known to work: Google owns the session, and
   * a published Apps Script web app has no URL that selects an account.
   */
  function accountPanelHtml() {
    var email = (window.CKOA_SIGNED_IN_EMAIL || '').trim();
    var appUrl = (window.CKOA_APP_URL || '').trim();

    var html = '<p class="account-line">Signed in as<br><strong>' +
      escapeHtml(email || 'an unknown Google account') + '</strong></p>';

    html += '<p class="field-label" style="margin-top:18px;">Wrong account?</p>' +
      '<a class="account-link danger" href="https://accounts.google.com/Logout" target="_top">Sign out of Google</a>' +
      '<p class="muted small">Then open the app link again and sign in with the right account. ' +
      'Note this signs you out of Gmail and every other Google service on this device, not just this app.</p>';

    html += '<p class="field-label" style="margin-top:18px;">Keep this account signed in</p>' +
      '<p class="muted small">To use a different account without signing out here, open a private ' +
      '(incognito) browser window and paste the app link into it:</p>' +
      (appUrl ? '<div class="url-box">' + escapeHtml(appUrl) + '</div>' : '') +
      '<p class="muted small">Useful on a shared device, or when one person needs both a restaurant ' +
      'account and a manager account.</p>';

    return html;
  }

  document.getElementById('nav-account').addEventListener('click', function () {
    document.getElementById('account-body').innerHTML = accountPanelHtml();
    document.getElementById('account-modal').classList.remove('hidden');
  });

  document.getElementById('close-account').addEventListener('click', function () {
    document.getElementById('account-modal').classList.add('hidden');
  });

  // ---------------------------------------------------------------------
  // Catalogue
  // ---------------------------------------------------------------------

  function renderCatalog() {
    var container = document.getElementById('catalog-list');
    if (!state.items.length) {
      container.innerHTML = '<div class="empty-state">No items are available to order right now.</div>';
      return;
    }
    var byCategory = {};
    var order = [];
    state.items.forEach(function (item) {
      if (!byCategory[item.category]) {
        byCategory[item.category] = [];
        order.push(item.category);
      }
      byCategory[item.category].push(item);
    });

    var html = '';
    order.forEach(function (cat) {
      html += '<div class="category-block"><div class="category-title">' + escapeHtml(cat) + '</div>';
      byCategory[cat].forEach(function (item) {
        var qty = state.cart[item.id] || 0;
        html +=
          '<div class="item-card" data-id="' + item.id + '">' +
          '<div class="item-info">' +
          '<div class="item-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="item-meta">' + formatCurrency(item.price) + ' / ' + escapeHtml(item.unit) + '</div>' +
          '</div>' +
          '<div class="qty-control">' +
          '<button class="qty-btn qty-minus' + (qty > 0 ? ' primary' : '') + '" aria-label="Decrease quantity">-</button>' +
          '<span class="qty-value">' + qty + '</span>' +
          '<button class="qty-btn primary qty-plus" aria-label="Increase quantity">+</button>' +
          '</div></div>';
      });
      html += '</div>';
    });
    container.innerHTML = html;

    container.querySelectorAll('.item-card').forEach(function (card) {
      var id = card.getAttribute('data-id');
      card.querySelector('.qty-plus').addEventListener('click', function () { changeQty(id, 1); });
      card.querySelector('.qty-minus').addEventListener('click', function () { changeQty(id, -1); });
    });
  }

  function changeQty(id, delta) {
    var current = state.cart[id] || 0;
    var next = Math.max(0, current + delta);
    if (next === 0) delete state.cart[id];
    else state.cart[id] = next;
    renderCatalog();
    renderCartBar();
  }

  function cartLines() {
    return Object.keys(state.cart).map(function (id) {
      var item = state.items.filter(function (i) { return i.id === id; })[0];
      if (!item) return null;
      return { id: id, name: item.name, unit: item.unit, price: item.price, qty: state.cart[id] };
    }).filter(Boolean);
  }

  function cartTotal() {
    return cartLines().reduce(function (sum, l) { return sum + l.price * l.qty; }, 0);
  }

  function renderCartBar() {
    var lines = cartLines();
    var bar = document.getElementById('cart-bar');
    if (!lines.length) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    var count = lines.reduce(function (s, l) { return s + l.qty; }, 0);
    document.getElementById('cart-count').textContent = count;
    document.getElementById('cart-total').textContent = formatCurrency(cartTotal());
  }

  // ---------------------------------------------------------------------
  // Checkout modal
  // ---------------------------------------------------------------------

  document.getElementById('checkout-btn').addEventListener('click', openCheckout);
  document.getElementById('close-checkout').addEventListener('click', closeCheckout);

  function openCheckout() {
    var lines = cartLines();
    if (!lines.length) return;

    var itemsHtml = lines.map(function (l) {
      return '<tr>' +
        '<td>' + escapeHtml(l.name) + '</td>' +
        '<td class="num">' + l.qty + '</td>' +
        '<td>' + escapeHtml(l.unit) + '</td>' +
        '<td class="num">' + formatCurrency(l.price * l.qty) + '</td>' +
        '</tr>';
    }).join('');
    document.getElementById('checkout-items').innerHTML = itemsHtml;
    document.getElementById('checkout-total').textContent = formatCurrency(cartTotal());

    var datesHtml = state.deliveryDates.map(function (d) {
      var selected = d.iso === state.selectedDate ? ' selected' : '';
      return '<div class="date-chip' + selected + '" data-iso="' + d.iso + '">' +
        escapeHtml(d.label) +
        '<span class="chip-deadline">Cut-off: ' + escapeHtml(d.deadlineLabel) + '</span>' +
        '</div>';
    }).join('');
    document.getElementById('delivery-dates').innerHTML = datesHtml ||
      '<span class="muted small">No delivery dates are open right now. Please check back later.</span>';
    document.querySelectorAll('.date-chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        state.selectedDate = chip.getAttribute('data-iso');
        document.querySelectorAll('.date-chip').forEach(function (c) { c.classList.remove('selected'); });
        chip.classList.add('selected');
      });
    });

    document.getElementById('orderer-name').textContent = state.restaurant.ordererName || state.restaurant.email;
    document.getElementById('delivery-address').value = state.restaurant.address || '';
    document.getElementById('order-error').classList.add('hidden');
    document.getElementById('checkout-modal').classList.remove('hidden');
  }

  function closeCheckout() {
    document.getElementById('checkout-modal').classList.add('hidden');
  }

  // Confirmed because it throws away everything the person has picked so far.
  document.getElementById('clear-cart-btn').addEventListener('click', function () {
    if (!window.confirm('Remove all items and start again?')) return;
    state.cart = {};
    closeCheckout();
    renderCatalog();
    renderCartBar();
  });

  document.getElementById('submit-order-btn').addEventListener('click', function () {
    document.getElementById('order-error').classList.add('hidden');

    var deliveryAddress = document.getElementById('delivery-address').value.trim();
    var notes = document.getElementById('order-notes').value.trim();
    var lines = cartLines();

    if (!lines.length) { showOrderError('Your cart is empty.'); return; }
    if (!state.selectedDate) { showOrderError('Please choose a delivery date.'); return; }
    if (!deliveryAddress) { showOrderError('Please enter a delivery address.'); return; }

    var btn = document.getElementById('submit-order-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Place order';
        if (!result.ok) { showOrderError(result.message || 'Something went wrong.'); return; }
        state.cart = {};
        document.getElementById('order-notes').value = '';
        closeCheckout();
        renderCatalog();
        renderCartBar();
        toast('Order ' + result.orderId + ' sent to the central kitchen.');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Place order';
        showOrderError(err.message || String(err));
      })
      .submitOrder({
        items: lines.map(function (l) { return { id: l.id, qty: l.qty }; }),
        deliveryDate: state.selectedDate,
        deliveryAddress: deliveryAddress,
        notes: notes
      });
  });

  function showOrderError(msg) {
    var el = document.getElementById('order-error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  // ---------------------------------------------------------------------
  // Navigation: catalogue vs history
  // ---------------------------------------------------------------------

  document.getElementById('nav-catalog').addEventListener('click', function () { switchView('catalog'); });
  document.getElementById('nav-history').addEventListener('click', function () { switchView('history'); });

  document.getElementById('nav-kitchen').addEventListener('click', function () { switchView('kitchen'); });
  document.getElementById('nav-invoiced').addEventListener('click', function () { switchView('invoiced'); });
  document.getElementById('nav-admin').addEventListener('click', function () { switchView('admin'); });
  document.getElementById('nav-admin-invoices').addEventListener('click', function () { switchView('admin-invoices'); });

  function switchView(view) {
    ['catalog', 'history', 'kitchen', 'invoiced', 'admin', 'admin-invoices'].forEach(function (v) {
      document.getElementById(v + '-view').classList.toggle('hidden', v !== view);
      var nav = document.getElementById('nav-' + v);
      if (nav) nav.classList.toggle('active', v === view);
    });
    document.getElementById('cart-bar').classList.toggle('hidden', view !== 'catalog' || !cartLines().length);

    if (view === 'history') loadHistory();
    if (view === 'kitchen' || view === 'invoiced') loadKitchenOrders(view);
    if (view === 'admin' || view === 'admin-invoices') loadAdminOrders(view);
  }

  function loadHistory() {
    var container = document.getElementById('history-list');
    container.innerHTML = '<div class="empty-state">Loading...</div>';
    google.script.run
      .withSuccessHandler(renderHistory)
      .withFailureHandler(function (err) { container.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>'; })
      .getMyOrders();
  }

  function renderHistory(orders) {
    var container = document.getElementById('history-list');
    if (!orders.length) {
      container.innerHTML = '<div class="empty-state">You have not placed any orders yet.</div>';
      return;
    }
    container.innerHTML = orders.map(function (o) {
      var itemsSummary = o.items.map(function (i) { return i.name + ' x' + i.qty; }).join(', ');
      return (
        '<div class="order-card">' +
        '<div class="order-top"><span>' + escapeHtml(o.orderId) + '</span><span>' + formatCurrency(o.total) + '</span></div>' +
        '<div class="order-items">' + escapeHtml(itemsSummary) + '</div>' +
        '<div class="order-items">Delivery: ' + escapeHtml(o.deliveryDate) + ' &middot; Placed: ' + escapeHtml(o.timestamp) + '</div>' +
        (o.notes ? '<div class="order-note">Note: ' + escapeHtml(o.notes) + '</div>' : '') +
        '<span class="status-badge">' + escapeHtml(o.status) + '</span>' +
        '</div>'
      );
    }).join('');
  }

  // ---------------------------------------------------------------------
  // Central kitchen: fulfil orders and issue invoices
  // ---------------------------------------------------------------------

  function loadKitchenOrders(view) {
    var container = document.getElementById(view + '-list');
    container.innerHTML = '<div class="empty-state">Loading...</div>';
    google.script.run
      .withSuccessHandler(function (data) {
        state.kitchen = data;
        renderKitchen(view);
      })
      .withFailureHandler(function (err) {
        container.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
      })
      .getKitchenOrders();
  }

  function renderKitchen(view) {
    if (view === 'invoiced') return renderInvoiced();

    var container = document.getElementById('kitchen-list');
    var orders = state.kitchen.pending || [];
    if (!orders.length) {
      container.innerHTML = '<div class="empty-state">No orders waiting. Everything has been invoiced.</div>';
      return;
    }

    container.innerHTML = orders.map(function (o) {
      var isOpen = o.orderId === state.openOrderId;
      var itemCount = o.items.reduce(function (s, i) { return s + i.qty; }, 0);
      return '<div class="order-card kitchen-card" data-order="' + escapeHtml(o.orderId) + '">' +
        '<div class="order-top"><span>' + escapeHtml(o.restaurantName) + '</span>' +
        '<span class="muted small">' + escapeHtml(o.orderId) + '</span></div>' +
        '<div class="order-items">Delivery: ' + escapeHtml(o.deliveryDate) +
        ' &middot; ' + itemCount + ' items &middot; ordered by ' + escapeHtml(o.ordererName) + '</div>' +
        (o.notes ? '<div class="order-note">Note: ' + escapeHtml(o.notes) + '</div>' : '') +
        (isOpen ? fulfilFormHtml(o) : '<button class="secondary-btn open-order-btn">Fulfil this order</button>') +
        '</div>';
    }).join('');

    bindKitchenHandlers();
  }

  function fulfilFormHtml(o) {
    var rows = o.items.map(function (li) {
      return '<tr>' +
        '<td>' + escapeHtml(li.name) + '</td>' +
        '<td class="num">' + li.qty + '</td>' +
        '<td><input type="number" class="supplied-input" data-id="' + escapeHtml(li.id) + '" ' +
        'value="' + li.qty + '" min="0" max="' + li.qty + '" step="any" inputmode="decimal"></td>' +
        '<td>' + escapeHtml(li.unit) + '</td>' +
        '</tr>';
    }).join('');

    return '<div class="fulfil-form">' +
      '<div class="checkout-table-wrap"><table class="checkout-table"><thead><tr>' +
      '<th>Item</th><th class="num">Ordered</th><th>Supplied</th><th>Unit</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="fulfil-actions">' +
      '<button class="link-btn supply-none-btn">Set all to 0</button>' +
      '<button class="link-btn supply-all-btn">Supply all as ordered</button>' +
      '</div>' +
      '<label class="field-label" for="kitchen-note">Note for the restaurant and accountant ' +
      '<span class="field-optional">optional</span></label>' +
      '<textarea id="kitchen-note" rows="2" placeholder="Why an item is short, substitutions, etc."></textarea>' +
      '<p class="issue-error error hidden"></p>' +
      '<button class="primary-btn issue-invoice-btn">Issue invoice</button>' +
      '<button class="link-btn cancel-fulfil-btn" style="display:block;margin:10px auto 0;">Cancel</button>' +
      '</div>';
  }

  function bindKitchenHandlers() {
    var container = document.getElementById('kitchen-list');

    container.querySelectorAll('.open-order-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.openOrderId = btn.closest('.kitchen-card').getAttribute('data-order');
        renderKitchen('kitchen');
      });
    });

    container.querySelectorAll('.cancel-fulfil-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.openOrderId = null;
        renderKitchen('kitchen');
      });
    });

    container.querySelectorAll('.supply-all-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.closest('.kitchen-card').querySelectorAll('.supplied-input').forEach(function (input) {
          input.value = input.getAttribute('max');
        });
      });
    });

    container.querySelectorAll('.supply-none-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        btn.closest('.kitchen-card').querySelectorAll('.supplied-input').forEach(function (input) {
          input.value = 0;
        });
      });
    });

    container.querySelectorAll('.issue-invoice-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { submitInvoice(btn); });
    });
  }

  function submitInvoice(btn) {
    var card = btn.closest('.kitchen-card');
    var orderId = card.getAttribute('data-order');
    var errorEl = card.querySelector('.issue-error');
    errorEl.classList.add('hidden');

    var supplied = [];
    var shortCount = 0;
    card.querySelectorAll('.supplied-input').forEach(function (input) {
      var ordered = Number(input.getAttribute('max')) || 0;
      var qty = Math.min(Math.max(0, Number(input.value) || 0), ordered);
      if (qty < ordered) shortCount++;
      supplied.push({ id: input.getAttribute('data-id'), qty: qty });
    });

    var message = shortCount
      ? 'Issue this invoice? ' + shortCount + ' item(s) are short of what was ordered.'
      : 'Issue this invoice for the full order?';
    if (!window.confirm(message)) return;

    btn.disabled = true;
    btn.textContent = 'Issuing...';

    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = 'Issue invoice';
        state.openOrderId = null;
        toast('Invoice ' + result.invoiceRef + ' sent.');
        loadKitchenOrders('kitchen');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Issue invoice';
        errorEl.textContent = err.message || String(err);
        errorEl.classList.remove('hidden');
      })
      .issueInvoice({
        orderId: orderId,
        supplied: supplied,
        kitchenNote: (card.querySelector('#kitchen-note') || {}).value || ''
      });
  }

  function renderInvoiced() {
    var container = document.getElementById('invoiced-list');
    var orders = state.kitchen.invoiced || [];
    if (!orders.length) {
      container.innerHTML = '<div class="empty-state">No invoices issued yet.</div>';
      return;
    }
    container.innerHTML = orders.map(function (o) {
      var short = (o.supplied || []).filter(function (li) { return li.shortQty > 0; });
      return '<div class="order-card">' +
        '<div class="order-top"><span>' + escapeHtml(o.invoiceRef || o.orderId) + '</span>' +
        '<span>' + formatCurrency(o.invoiceTotal) + '</span></div>' +
        '<div class="order-items">' + escapeHtml(o.restaurantName) +
        ' &middot; delivery ' + escapeHtml(o.deliveryDate) + '</div>' +
        (short.length
          ? '<div class="order-note">Short: ' + escapeHtml(short.map(function (li) {
              return li.name + ' -' + li.shortQty;
            }).join(', ')) + '</div>'
          : '') +
        (o.kitchenNote ? '<div class="order-note">Note: ' + escapeHtml(o.kitchenNote) + '</div>' : '') +
        '<span class="status-badge">' + escapeHtml(o.status) + '</span>' +
        '</div>';
    }).join('');
  }

  // ---------------------------------------------------------------------
  // Admin: read-only view across every restaurant
  // ---------------------------------------------------------------------

  function loadAdminOrders(view) {
    var listId = view === 'admin' ? 'admin-list' : 'admin-invoices-list';
    var container = document.getElementById(listId);
    container.innerHTML = '<div class="empty-state">Loading...</div>';

    google.script.run
      .withSuccessHandler(function (data) {
        state.admin = data;
        if (view === 'admin') {
          fillRestaurantFilter(data.restaurants);
          renderAdminSummary(data.summary);
          renderAdminOrders();
        } else {
          renderAdminInvoices();
        }
      })
      .withFailureHandler(function (err) {
        container.innerHTML = '<div class="empty-state">' + escapeHtml(err.message || String(err)) + '</div>';
      })
      .getAdminOrders();
  }

  function fillRestaurantFilter(restaurants) {
    var select = document.getElementById('admin-restaurant-filter');
    if (select.options.length > 1) return; // already built
    select.innerHTML = '<option value="">All restaurants</option>' +
      (restaurants || []).map(function (n) {
        return '<option value="' + escapeHtml(n) + '">' + escapeHtml(n) + '</option>';
      }).join('');
  }

  function renderAdminSummary(s) {
    document.getElementById('admin-summary').innerHTML =
      statTile(s.orderCount, 'orders') +
      statTile(s.pendingCount, 'awaiting kitchen') +
      statTile(s.invoicedCount, 'invoiced') +
      statTile(formatCurrency(s.invoicedTotal), 'invoiced value');
  }

  function statTile(value, label) {
    return '<div class="stat-tile"><div class="stat-value">' + escapeHtml(String(value)) + '</div>' +
      '<div class="stat-label">' + escapeHtml(label) + '</div></div>';
  }

  document.getElementById('admin-restaurant-filter').addEventListener('change', renderAdminOrders);
  document.getElementById('admin-status-filter').addEventListener('change', renderAdminOrders);

  function renderAdminOrders() {
    var container = document.getElementById('admin-list');
    var restaurant = document.getElementById('admin-restaurant-filter').value;
    var status = document.getElementById('admin-status-filter').value;

    var orders = ((state.admin && state.admin.orders) || []).filter(function (o) {
      if (restaurant && o.restaurantName !== restaurant) return false;
      if (status && String(o.status) !== status) return false;
      return true;
    });

    if (!orders.length) {
      container.innerHTML = '<div class="empty-state">No orders match this filter.</div>';
      return;
    }

    container.innerHTML = orders.map(function (o) {
      var isOpen = o.orderId === state.openOrderId;
      var invoiced = String(o.status) === 'Invoiced';
      return '<div class="order-card admin-card" data-order="' + escapeHtml(o.orderId) + '">' +
        '<div class="order-top"><span>' + escapeHtml(o.restaurantName) + '</span>' +
        '<span>' + formatCurrency(invoiced ? o.invoiceTotal : o.total) + '</span></div>' +
        '<div class="order-items">' + escapeHtml(o.orderId) +
        ' &middot; delivery ' + escapeHtml(o.deliveryDate) +
        ' &middot; ' + escapeHtml(o.ordererName) + '</div>' +
        '<span class="status-badge' + (invoiced ? '' : ' pending') + '">' + escapeHtml(o.status) + '</span>' +
        (invoiced && o.invoiceRef ? ' <span class="muted small">' + escapeHtml(o.invoiceRef) + '</span>' : '') +
        (isOpen ? adminDetailHtml(o) : '<button class="link-btn detail-btn" style="display:block;margin-top:8px;">Show items</button>') +
        '</div>';
    }).join('');

    container.querySelectorAll('.detail-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.openOrderId = btn.closest('.admin-card').getAttribute('data-order');
        renderAdminOrders();
      });
    });
    container.querySelectorAll('.hide-detail-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.openOrderId = null;
        renderAdminOrders();
      });
    });
  }

  /** Once invoiced, the supplied figures are the interesting ones. */
  function adminDetailHtml(o) {
    var invoiced = String(o.status) === 'Invoiced' && (o.supplied || []).length;
    var lines = invoiced ? o.supplied : o.items;

    var head = invoiced
      ? '<tr><th>Item</th><th class="num">Ordered</th><th class="num">Supplied</th><th>Unit</th><th class="num">Amount</th></tr>'
      : '<tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th class="num">Amount</th></tr>';

    var rows = (lines || []).map(function (li) {
      if (invoiced) {
        var short = li.shortQty > 0;
        return '<tr>' +
          '<td>' + escapeHtml(li.name) + '</td>' +
          '<td class="num muted">' + li.orderedQty + '</td>' +
          '<td class="num' + (short ? ' short' : '') + '">' + li.qty + '</td>' +
          '<td>' + escapeHtml(li.unit) + '</td>' +
          '<td class="num">' + formatCurrency(li.lineTotal) + '</td>' +
          '</tr>';
      }
      return '<tr>' +
        '<td>' + escapeHtml(li.name) + '</td>' +
        '<td class="num">' + li.qty + '</td>' +
        '<td>' + escapeHtml(li.unit) + '</td>' +
        '<td class="num">' + formatCurrency(li.lineTotal) + '</td>' +
        '</tr>';
    }).join('');

    return '<div class="admin-detail">' +
      '<div class="checkout-table-wrap"><table class="checkout-table"><thead>' + head +
      '</thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="order-items" style="margin-top:8px;">Placed ' + escapeHtml(o.timestamp) +
      ' &middot; deliver to ' + escapeHtml(o.deliveryAddress) + '</div>' +
      (o.notes ? '<div class="order-note">Restaurant: ' + escapeHtml(o.notes) + '</div>' : '') +
      (o.kitchenNote ? '<div class="order-note">Kitchen: ' + escapeHtml(o.kitchenNote) + '</div>' : '') +
      '<button class="link-btn hide-detail-btn" style="display:block;margin-top:8px;">Hide items</button>' +
      '</div>';
  }

  function renderAdminInvoices() {
    var container = document.getElementById('admin-invoices-list');
    var invoices = ((state.admin && state.admin.orders) || []).filter(function (o) {
      return String(o.status) === 'Invoiced';
    });

    if (!invoices.length) {
      container.innerHTML = '<div class="empty-state">No invoices have been issued yet.</div>';
      return;
    }

    container.innerHTML = invoices.map(function (o) {
      var short = (o.supplied || []).filter(function (li) { return li.shortQty > 0; });
      return '<div class="order-card">' +
        '<div class="order-top"><span>' + escapeHtml(o.invoiceRef || o.orderId) + '</span>' +
        '<span>' + formatCurrency(o.invoiceTotal) + '</span></div>' +
        '<div class="order-items">' + escapeHtml(o.restaurantName) +
        ' &middot; order ' + escapeHtml(o.orderId) +
        ' &middot; delivery ' + escapeHtml(o.deliveryDate) + '</div>' +
        (short.length
          ? '<div class="order-note">Short: ' + escapeHtml(short.map(function (li) {
              return li.name + ' -' + li.shortQty;
            }).join(', ')) + '</div>'
          : '<div class="order-items muted">Supplied in full</div>') +
        (o.kitchenNote ? '<div class="order-note">Kitchen: ' + escapeHtml(o.kitchenNote) + '</div>' : '') +
        '</div>';
    }).join('');
  }

  // ---------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------

  /** Australian dollars, e.g. 1234.5 -> "$1,234.50". Matches Code.gs. */
  function formatCurrency(n) {
    var num = Number(n);
    if (isNaN(num)) num = 0;
    var parts = Math.abs(num).toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (num < 0 ? '-$' : '$') + parts.join('.');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3500);
  }
})();
</script>
